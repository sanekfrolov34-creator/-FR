<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход / Регистрация — NekoArcGames</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-box">
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Вход</button>
                <button class="tab-btn" onclick="switchTab('register')">Регистрация</button>
            </div>

            <form id="login-form" class="auth-form active" onsubmit="handleLogin(event)">
                <h2><i class="fas fa-sign-in-alt"></i> Авторизация</h2>
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" id="login-username" placeholder="Ваш логин" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" placeholder="Ваш пароль" required>
                        <i class="fas fa-eye toggle-pass" onclick="togglePassword('login-password', this)"></i>
                    </div>
                </div>
                <button type="submit" class="submit-btn">Войти</button>
                <div id="login-error" class="error-msg"></div>
            </form>

            <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
                <h2><i class="fas fa-user-plus"></i> Регистрация</h2>
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" id="reg-username" placeholder="3-20 символов (a-z, 0-9, _)" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg-password" placeholder="Минимум 8 символов" required oninput="checkStrength()">
                        <i class="fas fa-eye toggle-pass" onclick="togglePassword('reg-password', this)"></i>
                    </div>
                    <div class="strength-bar">
                        <div id="strength-fill"></div>
                    </div>
                    <small id="strength-text"></small>
                </div>
                <div class="form-group">
                    <label>Подтверждение пароля</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg-confirm" placeholder="Повторите пароль" required>
                        <i class="fas fa-eye toggle-pass" onclick="togglePassword('reg-confirm', this)"></i>
                    </div>
                </div>
                <button type="submit" class="submit-btn">Зарегистрироваться</button>
                <div id="register-error" class="error-msg"></div>
                <div id="register-success" class="success-msg"></div>
            </form>

            <div class="back-link">
                <a href="Сайт1.html"><i class="fas fa-arrow-left"></i> Вернуться на сайт</a>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
